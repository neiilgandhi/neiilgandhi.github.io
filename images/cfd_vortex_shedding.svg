<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 495" width="880" height="495" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Vortex shedding begins near a Reynolds number of 50">
<rect width="880" height="495" fill="#ffffff"/>
<text x="40" y="46" font-size="20" font-weight="700" fill="#0f1b2d">Vortex shedding begins near a Reynolds number of 50</text>
<text x="40" y="70" font-size="14" fill="#4d5b70">Simulated 2D flow over a cylinder. Shedding frequency taken from the periodic lift force.</text>
<line x1="80" x2="820" y1="420.0" y2="420.0" stroke="#0f1b2d"/>
<text x="70" y="424.0" font-size="13" fill="#4d5b70" text-anchor="end">0</text>
<line x1="80" x2="820" y1="345.0" y2="345.0" stroke="#dde3ea"/>
<text x="70" y="349.0" font-size="13" fill="#4d5b70" text-anchor="end">100</text>
<line x1="80" x2="820" y1="270.0" y2="270.0" stroke="#dde3ea"/>
<text x="70" y="274.0" font-size="13" fill="#4d5b70" text-anchor="end">200</text>
<line x1="80" x2="820" y1="195.0" y2="195.0" stroke="#dde3ea"/>
<text x="70" y="199.0" font-size="13" fill="#4d5b70" text-anchor="end">300</text>
<line x1="80" x2="820" y1="120.0" y2="120.0" stroke="#dde3ea"/>
<text x="70" y="124.0" font-size="13" fill="#4d5b70" text-anchor="end">400</text>
<text x="80.0" y="442" font-size="13" fill="#4d5b70" text-anchor="middle">0</text>
<text x="256.2" y="442" font-size="13" fill="#4d5b70" text-anchor="middle">50</text>
<text x="432.4" y="442" font-size="13" fill="#4d5b70" text-anchor="middle">100</text>
<text x="608.6" y="442" font-size="13" fill="#4d5b70" text-anchor="middle">150</text>
<text x="784.8" y="442" font-size="13" fill="#4d5b70" text-anchor="middle">200</text>
<text x="450.0" y="466" font-size="13" fill="#4d5b70" text-anchor="middle">Reynolds number</text>
<text x="80" y="104" font-size="13" fill="#4d5b70">Shedding frequency, Hz</text>
<circle cx="81.8" cy="420.0" r="5" fill="#ffffff" stroke="#0f1b2d" stroke-width="1.5"/>
<circle cx="83.5" cy="420.0" r="5" fill="#ffffff" stroke="#0f1b2d" stroke-width="1.5"/>
<circle cx="87.0" cy="420.0" r="5" fill="#ffffff" stroke="#0f1b2d" stroke-width="1.5"/>
<circle cx="97.6" cy="420.0" r="5" fill="#ffffff" stroke="#0f1b2d" stroke-width="1.5"/>
<circle cx="115.2" cy="420.0" r="5" fill="#ffffff" stroke="#0f1b2d" stroke-width="1.5"/>
<circle cx="150.5" cy="420.0" r="5" fill="#ffffff" stroke="#0f1b2d" stroke-width="1.5"/>
<text x="157.5" y="406.0" font-size="13" font-weight="600" fill="#0f1b2d">Steady wake, no shedding</text>
<polyline points="256.2,375.2 432.4,290.6 608.6,207.7 784.8,128.4" fill="none" stroke="#2447d8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="256.2" cy="375.2" r="6" fill="#2447d8" stroke="#fff" stroke-width="2"/>
<circle cx="432.4" cy="290.6" r="6" fill="#2447d8" stroke="#fff" stroke-width="2"/>
<circle cx="608.6" cy="207.7" r="6" fill="#2447d8" stroke="#fff" stroke-width="2"/>
<circle cx="784.8" cy="128.4" r="6" fill="#2447d8" stroke="#fff" stroke-width="2"/>
<text x="246.2" y="365.2" font-size="13" font-weight="600" fill="#0f1b2d" text-anchor="end">Shedding starts: 60 Hz</text>
<text x="772.8" y="118.4" font-size="13" font-weight="600" fill="#0f1b2d" text-anchor="end">389 Hz</text>
</svg>
